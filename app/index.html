<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonida Key Art Lab — five-panel print studio</title>
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <div id="app" class="app-shell">

    <header id="app-header" class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LK</span>
        <div class="brand-copy">
          <h1>Leonida Key Art Lab</h1>
          <p>Five-panel print studio &middot; offline edition</p>
        </div>
      </div>

      <div class="export-cluster" role="group" aria-label="Export finished key art">
        <span class="export-label">Export PNG</span>
        <button type="button" id="export-square" class="btn btn-export">
          Square <small>1080 &times; 1080</small>
        </button>
        <button type="button" id="export-portrait" class="btn btn-export">
          Portrait <small>1080 &times; 1350</small>
        </button>
        <button type="button" id="export-wide" class="btn btn-export">
          Wide <small>1920 &times; 1080</small>
        </button>
      </div>
    </header>

    <div class="workspace">

      <aside id="sidebar" class="sidebar" aria-label="Editor controls">

        <section class="card">
          <h2 class="card-title"><span class="step">01</span> Source photos</h2>
          <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
               aria-label="Drop image files here or click to browse">
            <strong>Drop images here</strong>
            <span>or click to browse &middot; files stay on this device</span>
          </div>
          <input id="file-input" type="file" accept="image/*" multiple hidden>

          <div class="sample-row" aria-label="Bundled sample photographs">
            <button type="button" id="sample-boulevard" class="sample-btn">
              <img src="app/samples/boulevard.jpg" alt="">
              <span>Boulevard</span>
            </button>
            <button type="button" id="sample-pier" class="sample-btn">
              <img src="app/samples/pier.jpg" alt="">
              <span>Pier</span>
            </button>
          </div>

          <button type="button" id="auto-fill" class="btn btn-primary">
            Auto-fill five panels
          </button>
        </section>

        <section class="card">
          <h2 class="card-title"><span class="step">02</span> Panels &amp; framing</h2>
          <div id="panel-tabs" class="panel-tabs" role="tablist" aria-label="Active panel"></div>

          <div class="source-grid">
            <label class="source-cell"><span>Centre duo</span><select id="source-0" data-panel="0"></select></label>
            <label class="source-cell"><span>Northwest</span><select id="source-1" data-panel="1"></select></label>
            <label class="source-cell"><span>Southwest</span><select id="source-2" data-panel="2"></select></label>
            <label class="source-cell"><span>Northeast</span><select id="source-3" data-panel="3"></select></label>
            <label class="source-cell"><span>Southeast</span><select id="source-4" data-panel="4"></select></label>
          </div>

          <div class="control-grid">
            <label class="control">
              <span class="control-head">Zoom <output id="zoom-val" for="zoom">1.00&times;</output></span>
              <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1">
            </label>
            <label class="control">
              <span class="control-head">Offset X <output id="pos-x-val" for="pos-x">0</output></span>
              <input id="pos-x" type="range" min="-1" max="1" step="0.01" value="0">
            </label>
            <label class="control">
              <span class="control-head">Offset Y <output id="pos-y-val" for="pos-y">0</output></span>
              <input id="pos-y" type="range" min="-1" max="1" step="0.01" value="0">
            </label>
          </div>

          <label class="toggle-row">
            <input id="auto-crop" type="checkbox" checked>
            <span class="toggle-ui" aria-hidden="true"></span>
            <span>Auto-crop on the subject</span>
          </label>

          <button type="button" id="reset-panel" class="btn btn-ghost">Reset this panel</button>
        </section>

        <section class="card">
          <h2 class="card-title"><span class="step">03</span> Caption &amp; ink</h2>
          <label class="field">
            <span>Cover title</span>
            <input id="title-input" type="text" value="COPPER HALO" maxlength="24" spellcheck="false">
          </label>
          <label class="field">
            <span>Tagline</span>
            <input id="tagline-input" type="text" value="EVERY EMPIRE HAS A PRICE" maxlength="48" spellcheck="false">
          </label>
          <label class="field">
            <span>Badge</span>
            <input id="badge-input" type="text" value="LK-01" maxlength="8" spellcheck="false">
          </label>

          <div class="grade-row" id="grade-buttons" role="group" aria-label="Ink grade">
            <button type="button" id="grade-sunset" class="grade-btn is-active" data-grade="sunset">Sunset</button>
            <button type="button" id="grade-rain" class="grade-btn" data-grade="rain">Rain</button>
            <button type="button" id="grade-ink" class="grade-btn" data-grade="ink">Ink</button>
          </div>
        </section>

      </aside>

      <main class="main-area">
        <div class="stage-head">
          <span class="stage-kicker">Live compose</span>
          <span class="stage-hint">Halftone &middot; posterized flats &middot; ink drift</span>
        </div>
        <div id="stage" class="stage">
          <canvas id="preview" width="1080" height="1350" aria-label="Live cover preview"></canvas>
        </div>
        <div id="status" class="status">Starting the studio&hellip;</div>
      </main>

    </div>
  </div>

  <div id="cover-view" class="cover-view" hidden>
    <canvas id="cover-canvas" width="1080" height="1350" aria-label="Finished cover"></canvas>
  </div>

  <script type="module" src="app/src/main.js"></script>
</body>
</html>
